<a href="#top" aria-label="Back to top" title="Back to top" class="top-link" id="top-link">
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
    <path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</a>

<script>
  const topLink = document.getElementById('top-link');
  const updateTopLink = () => {
    const visible = window.scrollY > 700;
    topLink.style.visibility = visible ? 'visible' : 'hidden';
    topLink.style.opacity = visible ? '1' : '0';
  };
  updateTopLink();
  window.addEventListener('scroll', updateTopLink, { passive: true });
</script>
